[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traveai"
version = "0.1.0"
description = "Drone delivery API for merchants (US, medical + food) with a flight simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=2.13",  # required by Starlette's TestClient
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traveai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]  # auto-generated by Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
